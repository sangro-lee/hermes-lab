observability:
  enabled: false
  logs:
    directory: "logs/"
    redact_secrets: true
  metrics:
    record_job_duration: true
    record_exit_code: true
    record_gpu_requested: true
  tracing:
    enabled: false
    exporter_endpoint: "REPLACE_WITH_APPROVED_OTEL_ENDPOINT"
  note: "초기에는 파일 로그로 시작할 수 있습니다. 실제 OTEL exporter 연결은 별도 구성 필요."
